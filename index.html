<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#13221d">
<title>도비의 미술관 — 가짜를 찾아라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d2a44;--red:#c8483b;--gold:#d9b86a;--gold2:#b8913a;--wall:#13221d;--cream:#efe6d2;--plaque:#f1ead8;--ink:#2a2112;--mute:#b9a66f;--line:rgba(217,197,143,.28);--ok:#3f9a63;--paper:#f1ead8;--card:transparent}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--cream);background:var(--wall);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 75% 40% at 50% 18%,rgba(255,236,190,.20),transparent 70%),radial-gradient(ellipse at 50% 115%,rgba(0,0,0,.65),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),var(--wall)}
.serif{font-family:'Noto Serif KR',serif}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
#top{position:sticky;top:0;z-index:20;background:rgba(8,16,13,.82);backdrop-filter:blur(6px);color:#d9c58f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
#secret{position:fixed;left:0;top:0;width:60px;height:60px;z-index:50}
#brand{font-size:12px;letter-spacing:.2em;white-space:nowrap;color:#b9a66f}
#brand b{font-family:'Noto Serif KR',serif;letter-spacing:.04em;font-size:16px;color:#e6cf8f}
#stat{display:flex;align-items:center;gap:12px;font-weight:700}
#timer{font-variant-numeric:tabular-nums;font-size:19px;letter-spacing:.04em;color:#efe6d2}
#timer.over{color:#ff8a80}
#hearts{font-size:17px;letter-spacing:2px;color:#e8705f;min-width:20px}
#snd{background:transparent;color:#d9c58f;font-size:17px;opacity:.85}
#home{background:transparent;border:1px solid rgba(217,197,143,.45);color:#e6cf8f;font-size:12px;font-weight:700;padding:5px 10px;border-radius:16px;white-space:nowrap}
#keys{display:flex;gap:3px}
#keys span{width:21px;height:23px;border:1px solid rgba(217,197,143,.35);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Noto Serif KR',serif}
#keys span.on{background:linear-gradient(#e9cf85,#b8913a);color:#3a0f0a;border-color:#e6cf8f}
main{max-width:760px;margin:0 auto;padding:22px 18px 70px}
.card{padding:4px 2px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--mute);font-weight:700}
.stamp{display:inline-block;border:1.5px solid var(--gold);color:var(--gold);font-weight:700;font-size:11px;padding:3px 9px;letter-spacing:.18em}
.stamp.gold{border-color:var(--gold);color:var(--gold)}
.stamp.red{border-color:#e8705f;color:#e8705f}
h1{font-family:'Noto Serif KR',serif;font-size:32px;line-height:1.25;color:#f3e9cf;word-break:keep-all;font-weight:900;letter-spacing:.02em}
h2{font-family:'Noto Serif KR',serif;font-size:23px;line-height:1.35;color:#f3e9cf;word-break:keep-all;font-weight:700}
p.lead{font-size:16.5px;line-height:1.8;word-break:keep-all;margin-top:12px;color:#ddd3bb}
p.lead b{color:#f3e9cf}
.muted{color:var(--mute)}
.btn{display:block;width:100%;background:linear-gradient(#e9cf85,#b8913a);color:#2a1a08;font-size:17px;font-weight:900;padding:16px;border-radius:4px;margin-top:20px;letter-spacing:.04em;box-shadow:0 4px 0 #6b4f17,0 8px 18px rgba(0,0,0,.35);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #6b4f17}
.btn.red{background:linear-gradient(#b2382c,#8e2b23);color:#f6e7c8;box-shadow:0 4px 0 #4f150f,0 8px 18px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(#e9cf85,#b8913a)}
.btn.ghost{background:transparent;color:#e6cf8f;border:1.5px solid rgba(217,197,143,.6);box-shadow:none}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px}
.row .btn{margin-top:14px}
.hint-row{display:flex;gap:8px;margin-top:16px}
.hint-row button{flex:1;background:transparent;border:1px dashed rgba(217,197,143,.6);color:#d9c58f;font-weight:700;padding:10px;border-radius:4px;font-size:13.5px}
.hint-row button:disabled{opacity:.3}
.hintbox{margin-top:12px;background:rgba(217,184,106,.12);border-left:3px solid var(--gold);padding:12px 14px;font-size:15px;line-height:1.65;word-break:keep-all;color:#efe6d2}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.teams button{background:var(--plaque);border:2px solid transparent;border-radius:4px;padding:16px 0;font-size:24px;font-weight:900;color:var(--ink);font-family:'Noto Serif KR',serif;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.teams button.sel{background:linear-gradient(#e9cf85,#b8913a);border-color:#fff3c4}
.steps{display:flex;gap:5px;margin:0 0 16px}
.steps i{flex:1;height:3px;background:rgba(217,197,143,.2)}
.steps i.on{background:#e8705f}
.steps i.done{background:var(--gold)}
.q{font-size:19px;font-weight:700;line-height:1.55;word-break:keep-all;margin-top:12px;color:#f3e9cf}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opts button{background:var(--plaque);border:2px solid transparent;border-radius:3px;padding:14px 16px;font-size:16.5px;text-align:left;display:flex;gap:12px;align-items:center;line-height:1.45;word-break:keep-all;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .3s,transform .3s}
.opts button b{flex:0 0 28px;height:28px;border-radius:50%;background:#2a3b33;display:flex;align-items:center;justify-content:center;color:#e6cf8f;font-family:'Noto Serif KR',serif;font-size:14px}
.opts button.gone{opacity:0;transform:scale(.9);pointer-events:none;height:0;padding:0;margin:-5px 0;border:0;overflow:hidden}
.opts button.right{border-color:var(--ok);background:#e3f1e6}
.inp{display:flex;gap:10px;margin-top:16px}
.inp input{flex:1;font-size:22px;padding:14px;border:2px solid transparent;border-radius:3px;text-align:center;font-weight:700;color:var(--ink);background:var(--plaque);min-width:0}
.inp input:focus{outline:none;border-color:var(--gold)}
.inp button{background:linear-gradient(#e9cf85,#b8913a);color:#2a1a08;font-weight:900;font-size:16px;border-radius:3px;padding:0 20px}
.digits{display:flex;gap:10px;justify-content:center;margin-top:20px}
.digits input{width:62px;height:74px;font-size:34px;text-align:center;border:2px solid #8a7546;border-radius:3px;font-weight:900;color:#2a1a08;font-family:'Noto Serif KR',serif;background:linear-gradient(#f6eedb,#e3d6b5);box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.digits input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,184,106,.35)}
.file{background:var(--plaque);color:var(--ink);border-radius:2px;padding:20px 16px 16px;margin-top:16px;font-size:15.5px;line-height:1.85;word-break:keep-all;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.35);border-left:4px solid #8e2b23}
.file b{color:#1d1508}
.file:before{content:'감정 파일';position:absolute;top:-9px;left:12px;background:#8e2b23;color:#f6e7c8;font-size:11px;font-weight:700;padding:2px 9px;letter-spacing:.15em}
.file.loc:before{content:'찾아갈 그림'}
.file.guide:before{content:'관람 안내'}
.file .muted{color:#7a6a45}
.goldframe{padding:10px;background:linear-gradient(135deg,#7a5a1e,#e6c66e 25%,#9a7428 50%,#f0d688 75%,#8a6622);box-shadow:0 16px 34px rgba(0,0,0,.65),inset 0 0 0 2px rgba(0,0,0,.25);margin-top:16px}
.goldframe .mat{background:#f1ead8;padding:7px}
.plaque{margin:14px auto 0;max-width:290px;background:linear-gradient(#d6bb7a,#a3853f);color:#22180a;font-size:12px;padding:7px 12px;box-shadow:0 3px 6px rgba(0,0,0,.5);text-align:center;line-height:1.45}
.plaque b{font-family:'Noto Serif KR',serif;font-size:14px;display:block}
.spotwrap{position:relative;overflow:hidden;touch-action:manipulation;background:#000}
.spotwrap img{display:block;width:100%;height:auto}
.mark{position:absolute;border:3.5px solid #ff5a4a;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 12px rgba(255,90,74,.6);animation:pop .35s ease-out}
.mark.hint{border-color:#ffd56a;border-style:dashed;box-shadow:none;animation:blink 1s infinite}
.xmark{position:absolute;transform:translate(-50%,-50%);color:#fff;font-size:34px;font-weight:900;text-shadow:0 0 6px #000;pointer-events:none;animation:fade 1s forwards}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fade{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
@keyframes blink{50%{opacity:.3}}
.found{display:flex;gap:9px;justify-content:center;margin-top:16px;font-size:14px;align-items:center;color:var(--mute)}
.found i{width:22px;height:22px;border-radius:50%;border:2px solid #6e6346;display:inline-block}
.found i.on{background:#c0392b;border-color:#e6c66e}
.restore{position:relative;overflow:hidden}
.restore img{display:block;width:100%}
.restore img.top{position:absolute;inset:0;transition:opacity 2.2s ease}
.restore .dark{position:absolute;inset:0;background:#000;opacity:.92;transition:opacity 1.6s ease;pointer-events:none}
.restore .beam{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,240,200,.45),transparent 65%);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
.keycard{text-align:center;margin-top:22px}
.keyletter{display:inline-flex;width:96px;height:96px;background:linear-gradient(135deg,#f0d688,#b8913a);border-radius:4px;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#5a1a12;font-family:'Noto Serif KR',serif;box-shadow:0 0 0 3px #f6e7c8,0 0 30px rgba(240,214,136,.55);animation:pop2 .6s}
@keyframes pop2{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.clue{margin-top:18px;background:#f6e7e2;color:#2a1a12;border-left:4px solid #8e2b23;padding:14px;font-size:15.5px;line-height:1.7;text-align:left;word-break:keep-all;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.clue b{color:#a3291f}
.clue .muted{color:#7a5a50}
.floor{margin-top:18px;background:#e9dfc7;padding:14px;border-radius:2px;box-shadow:0 10px 26px rgba(0,0,0,.5);color:var(--ink);position:relative}
.floor:before{content:'1F  FLOOR GUIDE';position:absolute;top:-9px;left:12px;background:#2a3b33;color:#e6cf8f;font-size:10px;letter-spacing:.2em;padding:2px 8px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fgrid .rm{border:1.5px solid #8a7a58;background:#f6efdc;padding:8px 6px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.fgrid .rm small{font-size:9.5px;letter-spacing:.12em;color:#8a7546;font-weight:700}
.fgrid .rm b{font-family:'Noto Serif KR',serif;font-size:14px;color:#1d1508;line-height:1.25;word-break:keep-all}
.fgrid .rm span{font-size:11px;color:#8a7546}
.fgrid .rm.done{background:#d9caa3}
.fgrid .rm.done span{color:#5a1a12;font-weight:700}
.fgrid .rm.next{background:#fff6dd;border:2.5px solid #c0392b;animation:glow 1.4s infinite}
.fgrid .rm.next span{color:#c0392b;font-weight:900}
.fgrid .rm.locked{opacity:.55}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(192,57,43,.25)}}
.fgrid .hall{grid-column:1/5;border:1.5px dashed #8a7a58;padding:10px;text-align:center;font-size:12px;color:#6b5a35;letter-spacing:.1em;background:repeating-linear-gradient(45deg,#efe5cc 0 8px,#e9dfc5 8px 16px)}
.fgrid .hall b{font-family:'Noto Serif KR',serif;font-size:15px;color:#1d1508;letter-spacing:.05em;display:block}
.route{margin-top:12px;font-size:13px;color:var(--mute);text-align:center;line-height:1.7}
.route b{color:#e6cf8f}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.tiles button{width:62px;height:62px;font-size:28px;font-weight:900;font-family:'Noto Serif KR',serif;background:var(--plaque);border-radius:3px;color:var(--ink);box-shadow:0 4px 0 #8a7546,0 6px 12px rgba(0,0,0,.35)}
.tiles button.used{opacity:.15;pointer-events:none}
.slots{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.slots span{width:48px;height:58px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#5a1a12;background:linear-gradient(135deg,#f0d688,#c9a24b);font-family:'Noto Serif KR',serif}
.slots span:empty{background:rgba(217,184,106,.08)}
.sus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sus button{background:var(--plaque);border-radius:2px;padding:14px;text-align:left;color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.4);border-top:6px solid #2a3b33}
.sus button b{display:block;font-size:19px;color:#1d1508;font-family:'Noto Serif KR',serif}
.sus button span{font-size:12.5px;color:#6b5a35;line-height:1.6;display:block;margin-top:4px}
.sus button.gone{opacity:.3;pointer-events:none;text-decoration:line-through}
details summary{font-weight:700;color:var(--gold);cursor:pointer}
.cluelist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cluelist div{font-size:14px;line-height:1.55;background:var(--plaque);color:var(--ink);padding:8px 10px;word-break:keep-all}
.cluelist b{color:#a3291f}
.cert{background:linear-gradient(#fbf5e6,#efe3c6);color:#2a1a08;padding:30px 22px;text-align:center;position:relative;box-shadow:0 0 0 8px #b8913a,0 0 0 10px #f0d688,0 18px 40px rgba(0,0,0,.6);margin:14px 8px}
.cert h1{font-size:28px;color:#1d1508}
.cert .eyebrow{color:#8a7546}
.cert p.lead{color:#3a2a12}
.cert p.lead b{color:#1d1508}
.cert .stars{font-size:40px;color:#b8913a;letter-spacing:6px;margin:10px 0}
.cert table{margin:16px auto 0;border-collapse:collapse;font-size:16px}
.cert td{padding:6px 14px;border-bottom:1px solid #d8c9a4}
.cert td:first-child{color:#8a7546}
.cert .muted{color:#8a7546}
.seal{position:absolute;right:18px;bottom:18px;width:78px;height:78px;border:3px solid #b2382c;border-radius:50%;color:#b2382c;font-family:'Noto Serif KR',serif;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;transform:rotate(-12deg);opacity:.85}
.modal{position:fixed;inset:0;background:rgba(5,10,8,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto;background:#1b2e27;border:1px solid var(--gold);padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#f1ead8;color:#2a1a08;padding:12px 20px;border-radius:2px;font-weight:700;z-index:70;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:fade 2.2s forwards;white-space:nowrap}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tset{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.tset select,.tset input{font-size:15px;padding:6px;border-radius:3px;border:1px solid var(--line);background:#f1ead8;color:#2a1a08}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:3px;padding:10px;font-size:14px;margin-top:8px;width:100%;font-weight:700;color:#e6cf8f}
.tbtn.danger{color:#ff8a80;border-color:#a3473d}
.ans{font-size:13px;line-height:1.7;margin-top:10px;color:#ddd3bb}
.ans h4{margin-top:10px;color:#e6cf8f}
.feel-q{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:#f3e9cf;text-align:center;line-height:1.55;margin:24px 0 6px;word-break:keep-all}
.feelframe{margin:10px auto 0;max-width:260px}
.cover{text-align:center;padding-top:14px}
.cover .lamp{width:120px;height:10px;margin:0 auto;background:linear-gradient(#3a3a3a,#141414);border-radius:0 0 8px 8px}
.cover h1{font-size:38px;margin-top:10px;letter-spacing:.05em}
.cover .sub{color:#e0a86b;font-size:16px;letter-spacing:.35em;margin-top:6px;font-weight:700}
.cover .goldframe{display:inline-block;width:min(440px,82vw);margin-top:26px}
.cover .goldframe img{display:block;width:100%}
.ticket{display:flex;margin:26px auto 0;max-width:460px;background:#f1e7cc;color:#2a2112;border-radius:6px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.5);position:relative;text-align:left;cursor:pointer;width:100%;font-family:inherit;padding:0}
.ticket .l{flex:1;padding:14px 18px;border-right:2px dashed #b8a67a}
.ticket .l small{font-size:9.5px;letter-spacing:.25em;color:#8a7546;display:block}
.ticket .l b{display:block;font-family:'Noto Serif KR',serif;font-size:20px;margin-top:3px;color:#1d1508}
.ticket .l span{font-size:12px;color:#6b5a35}
.ticket .r{width:100px;display:flex;align-items:center;justify-content:center;background:#8e2b23;color:#f6e7c8;font-weight:900;font-size:16px;letter-spacing:.1em;text-align:center;line-height:1.35}
.ticket:before,.ticket:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--wall);right:91px}
.ticket:before{top:-9px}.ticket:after{bottom:-9px}
.ticket:active{transform:translateY(2px)}
.dl{margin-top:34px;border-top:1px solid var(--line);padding-top:20px;text-align:left}
.dl .eyebrow{text-align:center}
.dl a{display:flex;align-items:center;gap:12px;background:rgba(241,234,216,.06);border:1px solid var(--line);padding:12px 14px;margin-top:10px;text-decoration:none;color:var(--cream)}
.dl a b{display:block;color:#e6cf8f;font-size:15px}
.dl a span{font-size:12.5px;color:var(--mute)}
.dl a i{font-style:normal;font-size:22px}
.roomtitle{text-align:center;margin-top:10px}
.roomtitle .no{font-family:'Noto Serif KR',serif;font-size:13px;letter-spacing:.4em;color:var(--gold)}
.roomtitle h1{font-size:34px;margin-top:6px}
.roomtitle .line{width:40px;height:2px;background:var(--gold);margin:14px auto 0}
.stampmark{display:inline-block;border:3px solid #c0392b;color:#c0392b;font-weight:900;padding:4px 12px;transform:rotate(-8deg);font-family:'Noto Serif KR',serif;letter-spacing:.1em;background:rgba(255,255,255,.4)}

.op{position:relative;min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:10px 0 30px;user-select:none}
.op-skip{position:absolute;top:0;right:0;background:transparent;border:1px solid rgba(217,197,143,.45);color:#d9c58f;font-size:13px;padding:6px 12px;border-radius:16px;z-index:2}
.op-stage{width:100%;max-width:560px;height:min(58vh,560px);position:relative}
.op-room{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:opIn .9s ease}
.op-room.dim{filter:brightness(.55)}
.op-beam{position:absolute;top:-30px;left:50%;width:360px;height:120%;transform:translateX(-50%);background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(255,236,190,.35),transparent 70%);pointer-events:none}
.op-art{width:min(340px,64vw);margin:0}
.op-art img{display:block;width:100%}
.op-fake{position:absolute;inset:7px;width:calc(100% - 14px)!important;opacity:0;animation:opSwap 1.4s .6s forwards}
.op-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:opFlash 1s .6s;pointer-events:none}
.op-thief{position:absolute;bottom:0;width:min(170px,30vw);fill:#050807;filter:drop-shadow(0 0 12px rgba(0,0,0,.9));animation:opWalk 2.6s ease-in-out forwards}
.op-note{transform:rotate(-6deg);background:#f6efdc;color:#2a1a08;padding:30px 34px;box-shadow:0 14px 30px rgba(0,0,0,.7);animation:opDrop .9s cubic-bezier(.2,1.4,.4,1)}

.op-hint{margin-top:16px;font-size:14px;color:#b9a66f;opacity:0;transition:opacity .4s}
.op-hint.on{opacity:1;animation:blink 1.4s infinite}
@keyframes opIn{from{opacity:0}to{opacity:1}}
@keyframes opSwap{0%{opacity:0;filter:blur(6px)}100%{opacity:1;filter:none}}
@keyframes opFlash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
@keyframes opWalk{from{left:-30%}to{left:72%}}
@keyframes opDrop{from{transform:translateY(-120px) rotate(-20deg);opacity:0}to{transform:rotate(-6deg);opacity:1}}

function renderOpening(){
  clearInterval(opTimer);
  const sc = OPENING[opIdx];
  app.innerHTML = `<div class="op" id="op">
    <button class="op-skip" id="opskip">건너뛰기 ▸▸</button>
    <div class="op-stage">${opScene(sc.sc)}</div>

    <div class="op-hint" id="ophint">화면을 눌러 계속 ▸</div></div>`;
  if(sc.sfx) setTimeout(()=>beep(sc.sfx), 250);
  const full = sc.text; const plain = full.replace(/<[^>]+>/g,'');
  let n = 0; const el = $('#optext');
  const show = upto => { let out='', cnt=0, i=0; while(i<full.length && cnt<upto){ if(full[i]==='<'){ const j=full.indexOf('>',i); out+=full.slice(i,j+1); i=j+1; continue; } out+= full[i]==='\n'?'<br>':full[i]; cnt++; i++; }
    const opens=(out.match(/<b[^>]*>/g)||[]).length, closes=(out.match(/<\/b>/g)||[]).length; if(opens>closes) out+='</b>'; el.innerHTML = out; };
  let done = false;
  const finish = ()=>{ clearInterval(opTimer); done = true; show(plain.length); $('#ophint').classList.add('on'); };
  opTimer = setInterval(()=>{ n++; show(n); if(n%3===0) beep('type'); if(n>=plain.length) finish(); }, 55);
  $('#op').onclick = e=>{
    if(e.target.id==='opskip') return;
    if(!done){ finish(); return; }
    opIdx++; if(opIdx>=OPENING.length){ introStep=1; renderIntro(); } else renderOpening();
  };
  $('#opskip').onclick = ()=>{ clearInterval(opTimer); beep('tap'); introStep=1; renderIntro(); };
}

function stepBar(step){
  const steps = ['story','door','spot','q','feel','restore'];
  const idx = steps.indexOf(step);
  return `<div class="steps">${steps.map((s,i)=>`<i class="${i<idx?'done':(i===idx?'on':'')}"></i>`).join('')}</div>`;
}
function roomHead(r, label){
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="stamp">ROOM ${r.no}</span><span class="eyebrow">${r.name} · ${label}</span></div>`;
}

function renderRoom(){
  const c = S.cur; const r = ROOMS[c.room-1];
  if(c.step==='door' && !S.set.door){ c.step='spot'; save(); }
  ({story:roomStory, door:roomDoor, spot:roomSpot, q:roomQ, feel:roomFeel, restore:roomRestore})[c.step](r,c);
}

function roomDoor(r,c){

    <div class="hint-row"><button id="h1" ${c.h>=1?'disabled':''}>단서 (+${PENALTY}초)</button><button id="h2" ${c.h>=2||c.h<1?'disabled':''}>결정적 단서 (+${PENALTY}초)</button></div>
    <div id="hb">${c.h>=1?`<div class="hintbox">작품 정보 카드의 ‘제작 연도’ 칸에 적힌 숫자 ${len}자리예요.${len===4?' “~년경”이나 “1907~1908년”처럼 적혀 있으면 앞의 숫자를 쓰세요.':''}</div>`:''}${c.h>=2?`<div class="hintbox">문 암호는 <b>${r.code[0]}</b>예요.</div>`:''}</div></div>`;
  const ins = [...app.querySelectorAll('.digits input')];
  ins.forEach((inp,i)=>{
    inp.oninput = ()=>{ inp.value = inp.value.replace(/\D/g,'').slice(-1); if(inp.value && ins[i+1]) ins[i+1].focus(); if(ins.every(x=>x.value)) $('#go').focus(); };
    inp.onkeydown = e=>{ if(e.key==='Backspace' && !inp.value && ins[i-1]) ins[i-1].focus(); if(e.key==='Enter') $('#go').click(); };
  });
  setTimeout(()=>ins[0].focus(),100);
  $('#go').onclick = ()=>{
    const v = ins.map(x=>x.value).join('');
    if(v.length<len) return toast('숫자를 모두 입력하세요');
    if(r.code.includes(v)){ beep('key'); toast('🔓 문이 열렸어요!'); c.step='spot'; c.h=0; save(); setTimeout(render,500); }
    else { shake($('#dg')); ins.forEach(x=>x.value=''); ins[0].focus(); if(!loseLife()) toast('암호가 틀렸어요'); }
  };
  $('#h1').onclick = ()=>{ c.h=1; addPenalty(); save(); roomDoor(r,c); };
  $('#h2').onclick = ()=>{ c.h=2; addPenalty(); save(); roomDoor(r,c); };
}

function roomSpot(r,c){
  c.found = c.found||[]; c.sh = c.sh||0;
  const spots = SPOTS[r.no];
  app.innerHTML = `<div class="card">${stepBar('spot')}${roomHead(r,'위작 감정')}
    <h2 style="margin-top:14px">진품과 다른 곳 4곳을 찾아 터치하세요</h2>
    <p class="lead" style="font-size:15px">벽에 걸린 <b>진품</b>과 태블릿의 <b>위작</b>을 꼼꼼히 비교해요. 엉뚱한 곳을 누르면 목숨이 줄어요!</p>
    <div class="goldframe"><div class="mat"><div class="spotwrap" id="sw"><img src="img/r${r.no}_fake.jpg" id="fimg" alt="위작"></div></div></div>
    <div class="plaque"><b>${r.title} (위작)</b>${r.artist} · ROOM ${r.no} ${r.name}</div>
    <div class="found">${spots.map((_,i)=>`<i class="${c.found.includes(i)?'on':''}"></i>`).join('')}<span style="margin-left:6px">${c.found.length} / 4</span></div>
    <div class="hint-row"><button id="h1">단서: 위치 힌트 (+${PENALTY}초)</button></div>
    <div id="hb"></div></div>`;
  const sw = $('#sw'), img = $('#fimg');
  function draw(){
    if(!c.found || !document.body.contains(sw)) return;
    sw.querySelectorAll('.mark').forEach(m=>m.remove());
    const W = img.clientWidth, H = img.clientHeight;
    c.found.forEach(i=>{ const [x,y,rr]=spots[i]; const d=Math.max(36, rr*W*2); const m=document.createElement('div'); m.className='mark'; Object.assign(m.style,{left:x*W+'px',top:y*H+'px',width:d+'px',height:d+'px'}); sw.appendChild(m); });
    if(c.hintSpot!=null && !c.found.includes(c.hintSpot)){ const [x,y,rr]=spots[c.hintSpot]; const d=Math.max(80, rr*W*4); const m=document.createElement('div'); m.className='mark hint'; Object.assign(m.style,{left:x*W+'px',top:y*H+'px',width:d+'px',height:d+'px'}); sw.appendChild(m); }
  }
  img.onload = draw; if(img.complete) draw(); window.onresize = draw;
  let lock = false;
  sw.onclick = e=>{
    if(lock) return;
    const rect = img.getBoundingClientRect(); const px = e.clientX-rect.left, py = e.clientY-rect.top;
    const W = rect.width, H = rect.height;
    let hit = -1;
    spots.forEach(([x,y,rr],i)=>{ const dx=px-x*W, dy=py-y*H; const R=Math.max(26, rr*W*1.25); if(dx*dx+dy*dy<=R*R && hit<0) hit=i; });
    if(hit>=0){
      if(c.found.includes(hit)) return;
      c.found.push(hit); if(c.hintSpot===hit) c.hintSpot=null; save(); beep('ok'); vib(40);
      roomSpot(r,c);
      if(c.found.length===4){ lock=true; setTimeout(()=>{ toast('위작 감정 완료!'); c.step='q'; c.qi=0; c.found=null; c.hintSpot=null; save(); render(); }, 900); }
    } else {
      const x=document.createElement('div'); x.className='xmark'; x.textContent='✕'; x.style.left=px+'px'; x.style.top=py+'px'; sw.appendChild(x); setTimeout(()=>x.remove(),1000);
      lock = true; setTimeout(()=>lock=false, 700);
      loseLife();
    }
  };
  $('#h1').onclick = ()=>{
    const left = spots.map((_,i)=>i).filter(i=>!c.found.includes(i));
    if(!left.length) return;
    c.hintSpot = left[0]; addPenalty(); save(); draw();
    $('#hb').innerHTML = `<div class="hintbox">노란 점선 근처를 진품과 비교해 보세요. (${SPOT_NAMES[r.no][left[0]]})</div>`;
  };
}

function questionList(r){
  const base = r.qs.filter(q=>!q.vault); const vault = r.qs.filter(q=>q.vault);
  return shuffled(base, S.team*100 + r.no).concat(vault);
}

function renderQuestion(q, opts){
  // opts: {head, seedKey, state, onRight, total, idx}
  const st = opts.state; st.h = st.h||0; st.gone = st.gone||[];
  let body = '';
  if(q.file) body += `<div class="file">${q.file}</div>`;
  body += `<div class="q">${q.vault?'<span class="stamp gold" style="font-size:11px;margin-right:6px">두뇌 금고</span>':''}${q.q}</div>`;
  let order = [];
  if(q.t==='mc'){
    order = shuffled(q.o.map((_,i)=>i), opts.seed);
    body += `<div class="opts">${order.map((oi,k)=>`<button data-oi="${oi}" class="${st.gone.includes(oi)?'gone':''}"><b>${'ABCD'[k]}</b><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  } else {
    body += `<div class="inp"><input id="ans" placeholder="${q.ph||'정답'}" autocomplete="off"><button id="sub">확인</button></div>`;
  }
  const h2txt = q.t==='mc' ? '틀린 보기 2개 지우기' : '정답 보기';
  body += `<div class="hint-row"><button id="h1" ${st.h>=1?'disabled':''}>단서 (+${PENALTY}초)</button><button id="h2" ${st.h>=2||st.h<1?'disabled':''}>결정적 단서 (+${PENALTY}초)</button></div>`;
  body += `<div>${st.h>=1?`<div class="hintbox">💡 ${q.h}</div>`:''}${st.h>=2&&q.t==='in'?`<div class="hintbox">🔑 정답은 <b>${q.a[0]}</b>예요.</div>`:''}</div>`;
  app.innerHTML = `<div class="card">${opts.head}${body}</div>`;
  const right = ()=>{ beep('ok'); vib(40); st.h=0; st.gone=[]; opts.onRight(); };
  if(q.t==='mc'){
    app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const oi = +b.dataset.oi;
      if(oi===0){ b.classList.add('right'); app.querySelectorAll('.opts button').forEach(x=>x.onclick=null); setTimeout(right, 600); }
      else { st.gone.push(oi); save(); b.classList.add('gone'); if(!opts.lose()) toast('아니에요! 다시 골라 보세요'); }
    });
  } else {
    const inp = $('#ans');
    const sub = ()=>{
      const v = norm(inp.value); if(!v) return;
      if(q.a.map(norm).includes(v)){ inp.style.borderColor='var(--ok)'; setTimeout(right, 500); }
      else { shake(inp); inp.value=''; if(!opts.lose()) toast('아니에요! 다시 생각해 보세요'); }
    };
    $('#sub').onclick = sub; inp.onkeydown = e=>{ if(e.key==='Enter') sub(); };
  }
  $('#h1').onclick = ()=>{ st.h=1; addPenalty(); save(); renderQuestion(q, opts); };
  $('#h2').onclick = ()=>{ st.h=2; addPenalty(); if(q.t==='mc'){ const wrong=[1,2,3].filter(i=>!st.gone.includes(i)); st.gone.push(...wrong.slice(0, Math.max(0, wrong.length-1)).slice(0,2)); } save(); renderQuestion(q, opts); };
}

function roomQ(r,c){
  const list = questionList(r); c.qi = c.qi||0; c.qs = c.qs||{};
  const q = list[c.qi]; const st = c.qs[c.qi] = c.qs[c.qi]||{};
  const head = `${stepBar('q')}${roomHead(r, q.vault?'두뇌 금고':'감상 미션 '+(c.qi+1)+' / 3')}`;
  renderQuestion(q, {head, state:st, seed:S.team*1000 + r.no*10 + c.qi, lose:()=>loseLife(),
    onRight:()=>{ c.qi++; if(c.qi>=list.length){ c.step='feel'; c.qi=0; c.qs={}; c.feelAt=Date.now(); } save(); render(); }});
}

function roomRestore(r,c){
  app.innerHTML = `<div class="card">${stepBar('restore')}${roomHead(r,'진품 회수')}
    <h2 style="margin-top:14px">조명이 켜지고… 진품이 돌아왔어요!</h2>
    <div class="goldframe"><div class="mat"><div class="restore"><img src="img/r${r.no}.jpg" alt=""><img class="top" id="topimg" src="img/r${r.no}_fake.jpg" alt=""><div class="dark" id="dk"></div><div class="beam" id="bm"></div></div></div></div>
    <div class="plaque"><b>${r.title}</b>${r.artist} · 진품</div>
    <div id="after" style="opacity:0;transition:opacity .6s"></div></div>`;
  setTimeout(()=>{ $("#dk").style.opacity=0; $("#bm").style.opacity=1; $("#topimg").style.opacity=0; }, 600);
  setTimeout(()=>{
    beep('key');
    $('#after').innerHTML = `<div class="keycard"><div class="eyebrow">열쇠 글자 — 활동지 빨간 칸에 적으세요</div><div style="margin-top:10px"><span class="keyletter">${r.key}</span></div></div>
      <div class="clue">🔎 <b>범인 단서 ${r.no}</b><br>${r.clue}<br><span class="muted" style="font-size:13px">활동지 ‘범인 단서’ 칸에 적고, 추리표에 표시하세요.</span></div>
      <button class="btn red" id="go">${S.done.length+1>=8?'최후의 문으로':'다음 방으로'}</button>`;
    $('#after').style.opacity=1;
    $('#go').onclick = ()=>{ if(!S.done.includes(r.no)) S.done.push(r.no); S.cur=null; save(); render(); };
  }, 2900);
}

/* ================= 최후의 문 ================= */
function startFinal(){
  const pool = shuffled(EXAM_POOL, S.team*7+3).slice(0,2);
  const exam = shuffled(EXAM_FIXED.concat(pool), S.team*11+5).concat([EXAM_MATH]);
  S.final = {stage:'letters', picked:[], exam:exam.map(e=>e.tag), ei:0, es:{}, gone:[]};
  S.cur = {final:true, lives:S.set.lives};
  save();
}
function examByTag(t){ return t==='금고' ? EXAM_MATH : EXAM_FIXED.concat(EXAM_POOL).find(e=>e.tag===t); }

function renderFinal(){
  const F = S.final; if(!S.cur) S.cur={final:true, lives:S.set.lives};
  if(F.stage==='letters') return finalLetters(F);
  if(F.stage==='exam') return finalExam(F);
  if(F.stage==='culprit') return finalCulprit(F);
}

function finalLetters(F){
  const letters = shuffled(ANSWER.split('').concat(DECOYS), S.team*13+1);
  app.innerHTML = `<div class="card"><span class="stamp">FINAL · 1단계</span>
    <h2 class="serif" style="margin-top:14px">최후의 문</h2>
    <p class="lead" style="font-size:16px">모은 열쇠 글자를 <b>방 번호 순서(1→8)</b>대로 눌러 숨은 문장을 완성하세요. 카피캣이 섞어 둔 가짜 글자 4개에 속지 마세요!</p>
    <div class="slots">${Array.from({length:8},(_,i)=>`<span>${F.picked[i]!=null?letters[F.picked[i]]:''}</span>`).join('')}</div>
    <div class="tiles">${letters.map((l,i)=>`<button data-i="${i}" class="${F.picked.includes(i)?'used':''}">${l}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="undo">한 글자 지우기</button><button class="btn red" id="go">문 열기</button></div>
    <div class="hint-row"><button id="h1">단서 (+${PENALTY}초)</button></div><div id="hb"></div></div>`;
  app.querySelectorAll('.tiles button').forEach(b=>b.onclick=()=>{ if(F.picked.length>=8) return; F.picked.push(+b.dataset.i); beep('tap'); save(); finalLetters(F); });
  $('#undo').onclick = ()=>{ F.picked.pop(); save(); finalLetters(F); };
  $('#go').onclick = ()=>{
    const word = F.picked.map(i=>letters[i]).join('');
    if(word.length<8) return toast('8글자를 모두 채우세요');
    if(word===ANSWER){ beep('win'); toast('“자세히 봐야 보인다” — 문이 열렸어요!'); F.stage='exam'; S.cur.lives=S.set.lives; save(); setTimeout(render,1200); }
    else { F.picked=[]; save(); if(!loseLife()) { toast('문장이 맞지 않아요'); finalLetters(F); } }
  };
  $('#h1').onclick = ()=>{ addPenalty(); $('#hb').innerHTML = `<div class="hintbox">ROOM 1의 열쇠는 「자」, ROOM 8의 열쇠는 「다」예요. 문장 뜻: “○○○ 봐야 보인다”</div>`; };
}

function finalExam(F){
  const tag = F.exam[F.ei]; const q = examByTag(tag);
  const st = F.es[F.ei] = F.es[F.ei]||{};
  const head = `<span class="stamp">FINAL · 2단계</span><div class="eyebrow" style="margin-top:12px">최종 감정 시험 ${F.ei+1} / ${F.exam.length}</div>
    ${q.math?'':`<div class="file loc" style="margin-top:16px">교실에서 <b>‘감정 시험 ${q.tag}’</b> 그림을 찾아가세요.<br><span class="muted">${q.title} · ${q.artist}</span></div>`}`;
  renderQuestion(q, {head, state:st, seed:S.team*500+F.ei, lose:()=>loseLife(), onRight:()=>{ F.ei++; if(F.ei>=F.exam.length){ F.stage='culprit'; } save(); render(); }});
}

function finalCulprit(F){
  F.gone = F.gone||[];
  const got = S.done.slice().sort((a,b)=>a-b);
  app.innerHTML = `<div class="card"><span class="stamp">FINAL · 3단계</span>
    <h2 class="serif" style="margin-top:14px">카피캣의 정체는?</h2>
    <p class="lead" style="font-size:16px">활동지의 용의자 추리표를 보고 범인을 지목하세요. 기회는 단 한 번… 아니, 목숨만큼!</p>
    <div class="sus">${SUSPECTS.map(s=>`<button data-n="${s.n}" class="${F.gone.includes(s.n)?'gone':''}"><b>${s.n}</b><span>${s.r}<br>${s.d}</span></button>`).join('')}</div>
    <details style="margin-top:14px"><summary>모은 범인 단서 다시 보기</summary><div class="cluelist">${got.map(n=>`<div><b>단서 ${n}</b> · ${ROOMS[n-1].clue}</div>`).join('')}</div></details></div>`;
  app.querySelectorAll('.sus button').forEach(b=>b.onclick=()=>{
    const n = b.dataset.n;
    if(n===CULPRIT){ beep('win'); S.finishedAt = Date.now(); save(); setTimeout(render, 300); }
    else { F.gone.push(n); save(); if(!loseLife()){ toast(`${n}은(는) 범인이 아니에요!`); finalCulprit(F); } }
  });
}

function renderCert(){
  const t = elapsed();
  let stars = 3; if(S.hints>5) stars--; if(S.lost>6) stars--; stars=Math.max(1,stars);
  const grade = ['','견습 감정사','정식 감정사','명탐정 감정사'][stars];
  app.innerHTML = `<div class="cert">
    <div class="eyebrow">CERTIFICATE</div>
    <h1 class="serif" style="margin-top:8px">위작 감정 인증서</h1>
    <p class="lead" style="margin-top:14px"><b>${S.team}모둠 어린이 감정단</b>은 도비의 미술관에서 바꿔치기된 명화 8점을 모두 되찾고, 위조범 카피캣의 정체가 <b style="color:var(--red)">청소부</b>였음을 밝혀냈기에 이 인증서를 드립니다.</p>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div style="font-weight:900;color:var(--navy);font-size:20px">${grade}</div>
    <table><tr><td>탈출 시간</td><td>${fmt(t)}</td></tr><tr><td>단서 사용</td><td>${S.hints}번</td></tr><tr><td>잃은 목숨</td><td>${S.lost}개</td></tr></table>
    <p class="lead serif" style="margin-top:20px;font-size:19px;color:var(--navy)">“자세히 봐야 보인다”</p>
    <p class="muted" style="font-size:13px;margin-top:16px">도비의 미술관 관장 · 활동지 ‘탈출 기록’ 칸에 적어 주세요</p><div class="seal">도비의<br>미술관<br>감정필</div></div>`;
}

/* ================= 선생님 메뉴 ================= */
let taps = [];
$('#secret').addEventListener('click', ()=>{
  const now = Date.now(); taps = taps.filter(t=>now-t<2000); taps.push(now);
  if(taps.length>=5){ taps=[]; const pw = prompt('선생님 비밀번호'); if(pw==='1004') teacher(); else if(pw) alert('비밀번호가 달라요'); }
});
function teacher(){
  const m = document.createElement('div'); m.className='modal';
  const set = S.set; let resetArm = false;
  const answers = ROOMS.map(r=>`<h4>ROOM ${r.no} ${r.name} · 문 암호 ${r.code.join('/')} · 열쇠 「${r.key}」</h4>위작: ${SPOT_NAMES[r.no].join(', ')}<br>${r.qs.map(q=>q.t==='mc'?q.o[0]:q.a[0]).join(' / ')}`).join('')
    + `<h4>최후의 문</h4>자세히 봐야 보인다 · 범인: 청소부 · 수학 금고: 138<br>${EXAM_FIXED.concat(EXAM_POOL).map(e=>`${e.tag} ${e.title}: ${e.t==='mc'?e.o[0]:e.a[0]}`).join('<br>')}`;
  m.innerHTML = `<div class="card"><h2>선생님 메뉴</h2>
    <div class="tset"><span>방마다 목숨</span><select id="t_lv">${[1,2,3,4,5].map(n=>`<option ${n===set.lives?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="tset"><span>목숨을 다 잃으면</span><select id="t_ov"><option value="room" ${set.over==='room'?'selected':''}>그 방 처음부터</option><option value="game" ${set.over==='game'?'selected':''}>게임 맨 처음부터</option></select></div>
    <div class="tset"><span>문 암호 단계</span><select id="t_dr"><option value="1" ${set.door?'selected':''}>켜기</option><option value="0" ${!set.door?'selected':''}>끄기</option></select></div>
    <div class="tset"><span>모둠별 문제·보기 순서 섞기</span><select id="t_sh"><option value="1" ${set.shuffle?'selected':''}>켜기</option><option value="0" ${!set.shuffle?'selected':''}>끄기</option></select></div>
    <div class="tset"><span>소리</span><select id="t_sd"><option value="1" ${set.sound?'selected':''}>켜기</option><option value="0" ${!set.sound?'selected':''}>끄기</option></select></div>
    <button class="tbtn" id="t_skip">현재 단계 건너뛰기 (비상용)</button>
    <button class="tbtn" id="t_ans">정답표 보기</button><div class="ans" id="ansbox" style="display:none">${answers}</div>
    <button class="tbtn danger" id="t_reset">태블릿 초기화 (두 번 눌러야 실행)</button>
    <button class="btn" id="t_close">저장하고 닫기</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#t_ans').onclick = ()=>{ const b=m.querySelector('#ansbox'); b.style.display = b.style.display==='none'?'block':'none'; };
  m.querySelector('#t_skip').onclick = ()=>{ skipStep(); m.remove(); render(); };
  m.querySelector('#t_reset').onclick = e=>{
    if(!resetArm){ resetArm=true; e.target.textContent='한 번 더 누르면 모든 기록이 지워져요'; return; }
    const keep = S.set; S = fresh(); S.set = keep; introStep=0; save(); m.remove(); render();
  };
  m.querySelector('#t_close').onclick = ()=>{
    set.lives = +m.querySelector('#t_lv').value; set.over = m.querySelector('#t_ov').value;
    set.door = m.querySelector('#t_dr').value==='1'; set.shuffle = m.querySelector('#t_sh').value==='1'; set.sound = m.querySelector('#t_sd').value==='1';
    if(S.cur && S.cur.lives>set.lives) S.cur.lives=set.lives;
    save(); m.remove(); render();
  };
}
function skipStep(){
  if(S.finishedAt || !S.startAt) return;
  if(S.final){
    const F=S.final;
    if(F.stage==='letters') F.stage='exam';
    else if(F.stage==='exam'){ F.ei++; if(F.ei>=F.exam.length) F.stage='culprit'; }
    else if(F.stage==='culprit') S.finishedAt=Date.now();
    save(); return;
  }
  if(!S.cur) return;
  const c=S.cur, order=['story','door','spot','q','feel','restore'];
  if(c.step==='q'){ const n=ROOMS[c.room-1].qs.length; c.qi=(c.qi||0)+1; if(c.qi<n){ save(); return; } }
  if(c.step==='restore'){ if(!S.done.includes(c.room)) S.done.push(c.room); S.cur=null; save(); return; }
  c.step = order[order.indexOf(c.step)+1]; c.qi=0; c.qs={}; c.found=null; c.h=0; if(c.step==='feel') c.feelAt=Date.now();
  save();
}

render();
</script>
</body>
</html>
